[project]
name = "joke-api"
version = "0.1.0"
description = "Production-grade Joke API with local LLM"
requires-python = ">=3.11"

dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "better-profanity>=0.7.0",
    "fastapi>=0.138.0",
    "httpx>=0.28.1",
    "llama-cpp-python>=0.3.31",
    "loguru>=0.7.3",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.14.2",
    "rapidfuzz>=3.14.5",
    "redis>=8.0.0",
    "slowapi>=0.1.10",
    "sqlalchemy>=2.0.51",
    "structlog>=26.1.0",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pytest>=9.1.1",
    "ruff>=0.15.18",
]
